name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — domain checks and end-to-end smoke
    runs-on: ubuntu-latest

    # The end-to-end run exercises the full production topology: real constraints
    # in PostgreSQL, real Celery round trip through Redis, real PDF bytes.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: otc
          POSTGRES_PASSWORD: otc
          POSTGRES_DB: otc_ctrm
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U otc -d otc_ctrm"
          --health-interval 5s --health-timeout 5s --health-retries 12
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 12

    env:
      DATABASE_URL: postgresql+asyncpg://otc:otc@localhost:5432/otc_ctrm
      REDIS_URL: redis://localhost:6379/0
      CONFIRMATIONS_DIR: ${{ github.workspace }}/confirmations

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Domain self-check (no database)
        run: python test_app.py

      - name: Start API and Celery worker
        run: |
          nohup celery -A app.tasks worker --loglevel=info -c 2 > worker.log 2>&1 &
          nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > api.log 2>&1 &
          for _ in $(seq 1 40); do
            curl -sf http://127.0.0.1:8000/api/v1/health && exit 0
            sleep 1
          done
          echo "API did not become healthy"; cat api.log; exit 1

      - name: End-to-end smoke (PostgreSQL + Redis + Celery)
        run: python smoke.py

      - name: Service logs
        if: failure()
        run: tail -n 100 api.log worker.log

  web:
    name: Web — type-check and production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check and build
        run: npm run build
